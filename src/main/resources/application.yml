java:
  runtime:
    version: 17

server:
  port: ${MAIN_SERVICE_PORT}

spring:
  application:
    name: EBOOK-READER-MAIN-SERVICE

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 20MB

gplaybook:
  apikey:
    ${GPLAYBOOKS_APIKEY}

cors:
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

groq:
  api:
    key: ${GROQ_API_KEY}
  model:
    name: ${GROQ_MODEL_NAME:llama-3.3-70b-versatile}
  max:
    tokens: ${GROQ_MAX_TOKENS:3072}