name: Deploy Spring Boot to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get Elastic Beanstalk S3 bucket
        run: |
          BUCKET=$(aws elasticbeanstalk create-storage-location \
            --query S3Bucket \
            --output text)

          echo "S3_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Upload JAR to S3
        run: |
          aws s3 cp target/*.jar \
            s3://$S3_BUCKET/releases/app-${GITHUB_SHA}.jar

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ai-ebook-reader \
            --version-label app-${GITHUB_SHA} \
            --source-bundle \
            S3Bucket=$S3_BUCKET,S3Key=releases/app-${GITHUB_SHA}.jar

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name Ai-ebook-reader-env \
            --version-label app-${GITHUB_SHA}